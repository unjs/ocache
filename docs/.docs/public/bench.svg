<svg xmlns="http://www.w3.org/2000/svg" width="800" height="350" viewBox="0 0 800 350" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" role="img" class="ocache-chart"><title>ocache under load</title><desc>p99 latency with and without ocache for 7 workloads, the share of requests served without reaching the origin, and the medians across all of them.</desc><style>svg.ocache-chart{--surface:var(--ocache-chart-surface,#fcfcfb);--ink:var(--ocache-chart-ink,#0b0b0b);--ink2:var(--ocache-chart-ink-2,#52514e);--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--deemph:#a9a7a0}@media (prefers-color-scheme:dark){svg.ocache-chart{--surface:var(--ocache-chart-surface,#1a1a19);--ink:var(--ocache-chart-ink,#ffffff);--ink2:var(--ocache-chart-ink-2,#c3c2b7);--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--deemph:#6e6c67}}[data-theme="dark"] svg.ocache-chart,.dark svg.ocache-chart{--surface:var(--ocache-chart-surface,#1a1a19);--ink:var(--ocache-chart-ink,#ffffff);--ink2:var(--ocache-chart-ink-2,#c3c2b7);--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--deemph:#6e6c67}[data-theme="light"] svg.ocache-chart,.light svg.ocache-chart{--surface:var(--ocache-chart-surface,#fcfcfb);--ink:var(--ocache-chart-ink,#0b0b0b);--ink2:var(--ocache-chart-ink-2,#52514e);--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--deemph:#a9a7a0}@supports (--ocache:0){.ocache-chart .f-surface{fill:var(--surface)}.ocache-chart .f-ink{fill:var(--ink)}.ocache-chart .f-ink2{fill:var(--ink2)}.ocache-chart .f-muted{fill:var(--muted)}.ocache-chart .f-grid{fill:var(--grid)}.ocache-chart .f-axis{fill:var(--axis)}.ocache-chart .f-s1{fill:var(--s1)}.ocache-chart .f-s2{fill:var(--s2)}.ocache-chart .f-deemph{fill:var(--deemph)}.ocache-chart .k-surface{stroke:var(--surface)}.ocache-chart .k-grid{stroke:var(--grid)}.ocache-chart .k-axis{stroke:var(--axis)}}</style><rect width="800" heig